<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spatial VR Browser · Cardboard Edition</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
video{display:none}
</style></head><body>
<canvas id="c"></canvas><video id="v" playsinline muted autoplay></video>
<script>
"use strict";
/* ===== 1. Almacenamiento con versión y migración ===== */
const Store=(()=>{
  const KEY="svrb.settings",VER=3;
  const DEF={v:VER,ipd:6.3,par:0.05,fov:1,sens:1,thr:0.28,cam:0,useHands:true,useGyro:true,home:"https://example.com",dist:0.25,ppcm:63};
  let data={...DEF},ok=true;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);
      if(!o.v||o.v<2){ if(typeof o.ipd==="number")data.ipd=o.ipd; } // v1 → v2: solo conserva IPD
      else Object.keys(DEF).forEach(k=>{if(typeof o[k]===typeof DEF[k])data[k]=o[k]});}
  }catch(e){ok=false}
  data.ipd=Math.min(7.5,Math.max(5.5,data.ipd));
  return{d:data,ok:()=>ok,save(){try{localStorage.setItem(KEY,JSON.stringify(data));ok=true}catch(e){ok=false;Err.show("Almacenamiento bloqueado o lleno: los ajustes no se guardarán.")}}};
})();

/* ===== 2. Errores centralizados ===== */
const Err={msg:"",t:0,show(m){this.msg=m;this.t=performance.now()+6000;console.error(m)}};
addEventListener("error",e=>Err.show("Error: "+e.message));
addEventListener("unhandledrejection",e=>Err.show("Error: "+(e.reason&&e.reason.message||e.reason)));

/* ===== 3. Cámara (flujo único) ===== */
const Cam={v:document.getElementById("v"),stream:null,devs:[],on:false,
  async start(){
    this.stop();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){Err.show("Cámara no disponible: se necesita HTTPS (contexto seguro).");return false}
    try{
      let c={video:{facingMode:{ideal:"environment"},width:{ideal:960},height:{ideal:540}},audio:false};
      if(this.devs[Store.d.cam])c.video={deviceId:{exact:this.devs[Store.d.cam].deviceId},width:{ideal:960},height:{ideal:540}};
      this.stream=await navigator.mediaDevices.getUserMedia(c);
      this.v.srcObject=this.stream;await this.v.play();
      this.devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
      this.on=true;return true;
    }catch(e){
      this.on=false;
      Err.show(e.name==="NotAllowedError"?"Permiso de cámara denegado. Actívalo en los ajustes del sitio.":e.name==="NotFoundError"?"No se encontró ninguna cámara.":"Error de cámara: "+e.message);
      return false;}
  },
  stop(){if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;this.on=false},
  async next(){if(this.devs.length<2){Err.show("Solo hay una cámara disponible.");return}
    Store.d.cam=(Store.d.cam+1)%this.devs.length;Store.save();await this.start()}
};

/* ===== 4. MediaPipe + seguimiento ===== */
const Hands={lm:null,state:"apagado",hands:[],last:0,
  async init(){
    if(this.lm||this.state==="cargando")return;this.state="cargando";
    try{
      const M=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
      const fs=await M.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      const url="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      try{this.lm=await M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:"GPU"},runningMode:"VIDEO",numHands:2})}
      catch(e){this.lm=await M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:"CPU"},runningMode:"VIDEO",numHands:2})}
      this.state="listo";
    }catch(e){this.state="error";Err.show("MediaPipe no pudo iniciar (¿sin internet?). Usa controles táctiles.")}
  },
  update(now){
    if(!Store.d.useHands||!this.lm||!Cam.on||Cam.v.readyState<2)return;
    if(now-this.last<33)return;this.last=now; // ~30 Hz
    let r;try{r=this.lm.detectForVideo(Cam.v,now)}catch(e){return}
    const seen=[false,false];
    (r.landmarks||[]).slice(0,2).forEach((pts,i)=>{
      const h=this.hands[i]||(this.hands[i]={p:null,pinch:false,t:0,down:0,grab:null,ptr:{x:0,y:0}});
      const m=pts.map(q=>{const u=Cam.map(q.x,q.y);return{x:u.x,y:u.y,z:q.z}});
      if(h.p&&now-h.t<400)m.forEach((q,k)=>{const a=0.55;q.x=h.p[k].x+(q.x-h.p[k].x)*a;q.y=h.p[k].y+(q.y-h.p[k].y)*a});
      h.p=m;h.t=now;h.ptr=m[8];seen[i]=true;
      const sc=Math.hypot(m[0].x-m[9].x,m[0].y-m[9].y)||0.1,d=Math.hypot(m[4].x-m[8].x,m[4].y-m[8].y)/sc,th=Store.d.thr;
      h.pinchNow=h.pinch?d<th*1.4:d<th;
    });
    this.hands.forEach((h,i)=>{if(!seen[i]&&h&&now-h.t>300){h.p=null;h.pinchNow=false}});
  }
};
/* mapeo vídeo→coordenadas de la lente (cover, unidades de radio) */
Cam.size=()=>{const v=Cam.v,va=(v.videoWidth||16)/(v.videoHeight||9),w0=2*va,h0=2,c=Math.max(2*L.hw/L.R/w0,2*L.hh/L.R/h0)*Store.d.fov;return{w:w0*c,h:h0*c}};
Cam.map=(nx,ny)=>{const z=Cam.size();return{x:(nx-0.5)*z.w,y:(ny-0.5)*z.h}};

/* ===== 5. Interfaz: paneles ===== */
const TV=["YouTube","Netflix","Twitch","Disney+","Prime Video","Spotify","Pluto TV","Vimeo","Dailymotion","Crunchyroll","Max","Plex","Tubi"];
const TVURL={"YouTube":"https://www.youtube.com/tv","Netflix":"https://www.netflix.com","Twitch":"https://www.twitch.tv","Disney+":"https://www.disneyplus.com","Prime Video":"https://www.primevideo.com","Spotify":"https://open.spotify.com","Pluto TV":"https://pluto.tv","Vimeo":"https://vimeo.com","Dailymotion":"https://www.dailymotion.com","Crunchyroll":"https://www.crunchyroll.com","Max":"https://www.max.com","Plex":"https://app.plex.tv","Tubi":"https://tubitv.com"};
let panels=[],head={x:0,y:0,y0:null,p0:null},kbTarget=null,url="https://",tvOpen=null;
let dirty=0;
function P(id,title,x,y,w,h,z,btns,extra){const p={id,title,x,y,w,h,z:z||1.2,s:1,btns,...extra};panels=panels.filter(q=>q.id!==id);panels.push(p);return p}
function grid(items,cols,w,h,top){return items.map((it,i)=>({l:it.l||it,f:it.f,x:-w/2+0.04+(i%cols)*((w-0.08)/cols),y:top+Math.floor(i/cols)*0.17,w:(w-0.08)/cols-0.02,h:0.14}))}
function close(id){panels=panels.filter(p=>p.id!==id)}
function openHome(){panels=[];
  const items=[["Navegador",openBrowser],["Smart TV",openTV],["Cámara",()=>Cam.start()],["Controles",openControls],["Ajustes",openSettings],["Estado",openStatus]].map(a=>({l:a[0],f:a[1]}));
  P("home","Spatial VR Browser",0,-0.1,1.3,0.7,1.2,grid(items,3,1.3,0.12))}
function openTV(){P("tv","Smart TV · 13 apps",0,0,1.7,0.95,1.1,grid(TV.map(n=>({l:n,f:()=>openApp(n)})),4,1.7,0.1).concat([{l:"Cerrar",x:-0.15,y:0.38,w:0.3,h:0.1,f:()=>close("tv")}]))}
const EMB={YouTube:"https://www.youtube.com/watch?v=",Vimeo:"https://vimeo.com/",Dailymotion:"https://www.dailymotion.com/video/",Twitch:"https://www.twitch.tv/",Spotify:"https://open.spotify.com/track/"};
function navTo(u){if(!/^https?:\/\//.test(u))u="https://"+u;if(!window.open(u,"_blank","noopener"))Err.show("El navegador bloqueó la ventana emergente.")}
function openApp(n){const e=EMB[n];P("app","Smart TV: "+n,0.2,0.1,1.3,0.6,0.95,[
  {l:e?"Abrir en visor":"Abrir en pestaña",x:-0.6,y:0.05,w:0.55,h:0.14,f:()=>{close("app");if(e){url=e;openBrowser();kbTarget="url";openKeyboard()}else navTo(TVURL[n])}},
  {l:"Cerrar",x:0.05,y:0.05,w:0.5,h:0.14,f:()=>close("app")}],{note:e?"Escribe el enlace o ID: usa su reproductor oficial incrustable.":"Este servicio bloquea la incrustación (DRM): se abre en pestaña."})}

/* ---- Visor web legal: reproductores oficiales incrustables + lector Wikipedia (API con CORS) + iframe con aviso ---- */
const c2=document.createElement("canvas");c2.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5";document.body.appendChild(c2);const x2=c2.getContext("2d");
function addQ(s,q){return s+(s.includes("?")?"&":"?")+q}
function emb(src,mute){return{k:"emb",src,mute}}
function resolve(u){u=u.trim();let m,id;
  if(!/^[a-z]+:\/\//i.test(u)){if(/\s/.test(u)||!/\./.test(u))return{k:"wiki",q:u};u="https://"+u}
  let x;try{x=new URL(u)}catch(e){return null}
  if(!/^https?:$/.test(x.protocol))return null;
  const h=x.hostname.replace(/^www\./,""),p=x.pathname;
  if(/wikipedia\.org$/.test(h)&&(m=p.match(/^\/wiki\/(.+)/)))return{k:"wiki",q:decodeURIComponent(m[1]).replace(/_/g," ")};
  if(h==="youtu.be"&&(id=p.slice(1)))return emb("https://www.youtube.com/embed/"+id+"?playsinline=1&rel=0","mute=1");
  if(/youtube\.com$/.test(h)&&(id=x.searchParams.get("v")))return emb("https://www.youtube.com/embed/"+id+"?playsinline=1&rel=0","mute=1");
  if(h==="vimeo.com"&&(m=p.match(/^\/(\d+)/)))return emb("https://player.vimeo.com/video/"+m[1],"muted=1");
  if(/dailymotion\.com$/.test(h)&&(m=p.match(/\/video\/(\w+)/)))return emb("https://www.dailymotion.com/embed/video/"+m[1],"mute=1");
  if(h==="twitch.tv"&&(m=p.match(/^\/(\w+)/)))return emb("https://player.twitch.tv/?channel="+m[1]+"&parent="+(location.hostname||"localhost"),"muted=true");
  if(h==="open.spotify.com"&&(m=p.match(/^\/(track|album|playlist|episode|show|artist)\/(\w+)/)))return emb("https://open.spotify.com/embed/"+m[1]+"/"+m[2],"");
  return{k:"gen",src:x.href}}
const Web={h:[],i:-1,txt:null,sc:0,mode:"st",lines:[],key:"",busy:"",title:"",layer:null,src:null,ok:false,sig:"",to:0,
  init(){if(this.layer)return;this.layer=[0,1].map(()=>{const d=document.createElement("div");d.style.cssText="position:fixed;display:none;overflow:hidden;background:#000";document.body.appendChild(d);return d})},
  show(r){this.init();this.src=r;this.ok=false;this.sig="";
    this.layer.forEach((el,e)=>{el.innerHTML="";if(!r||(e===1&&this.mode==="mono"))return;
      const f=document.createElement("iframe");f.src=(e===1&&r.k==="emb"&&r.mute)?addQ(r.src,r.mute):r.src;
      f.allow="autoplay; encrypted-media; fullscreen; picture-in-picture";f.referrerPolicy="strict-origin-when-cross-origin";
      f.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-presentation");
      f.style.cssText="width:100%;height:100%;border:0;background:#fff";f.onload=()=>{this.ok=true};el.appendChild(f)})},
  place(){if(!this.layer)return;const kb=panels.some(p=>p.id==="kb"),sig=[L.W,L.H,L.R,kb,this.mode,!!this.src].join();if(sig===this.sig)return;this.sig=sig;
    const d=devicePixelRatio||1,R=L.R/d,mono=this.mode==="mono";
    this.layer.forEach((el,e)=>{if(!this.src||kb||(e===1&&mono)){el.style.display="none";return}
      const cx=(mono?L.W/2:L.cx[e])/d,w=mono?R*3:R*1.7,h=R*0.96;
      el.style.cssText=`position:fixed;overflow:hidden;background:#000;display:block;left:${cx-w/2}px;top:${L.cy/d-R*0.8}px;width:${w}px;height:${h}px;clip-path:${mono?"none":`inset(0 round ${R*0.12}px)`}`})},
  go(u,push){u=(u||"").trim();if(!u)return;const r=resolve(u);if(!r){Err.show("Dirección no válida. Usa http(s) o escribe una búsqueda.");return}
    if(push!==false){this.h=this.h.slice(0,this.i+1);this.h.push(u);this.i=this.h.length-1}
    url=u;close("rd");this.show(null);clearTimeout(this.to);
    if(r.k==="wiki"){openReader();loadWiki(r.q)}
    else{this.show(r);this.to=setTimeout(()=>{if(!this.ok)Err.show("Sin respuesta: el sitio puede bloquear iframes. Usa «Pestaña».")},9000)}},
  back(){if(this.i>0)this.go(this.h[--this.i],false);else Err.show("No hay página anterior.")},
  fwd(){if(this.i<this.h.length-1)this.go(this.h[++this.i],false);else Err.show("No hay página siguiente.")},
  reload(){if(this.i>=0)this.go(this.h[this.i],false)}};
async function loadWiki(q){Web.busy="Cargando…";Web.txt=null;
  try{const A="https://es.wikipedia.org/w/api.php?format=json&origin=*&";
    const s=await(await fetch(A+"action=opensearch&limit=1&search="+encodeURIComponent(q))).json();
    if(!s[1]||!s[1][0])throw new Error("Sin resultados en Wikipedia para «"+q+"»");
    const r=await(await fetch(A+"action=query&prop=extracts&explaintext=1&exsectionformat=plain&redirects=1&titles="+encodeURIComponent(s[1][0]))).json();
    const pg=Object.values(r.query.pages)[0];Web.title=pg.title;Web.txt=pg.extract||"(sin texto)";Web.sc=0;Web.key="";
    const p=panels.find(p=>p.id==="rd");if(p)p.title=pg.title;
  }catch(e){Err.show("Lectura: "+e.message);Web.txt="No se pudo cargar. Comprueba la conexión."}
  Web.busy=""}
function drawReader(c,px,top,w,h,f){c.save();c.scale(.01,.01);c.textAlign="left";c.fillStyle="#e8fbff";const fs=0.045*f*100,X=(px-w/2+0.05)*100,Y=top*100;c.font=fs+"px system-ui";
  if(!Web.txt){c.fillText(Web.busy||"…",X,Y+20*f);c.restore();return}
  const mw=(w-0.1)*100,k=mw+"|"+Web.txt.length+"|"+f;
  if(Web.key!==k){Web.key=k;Web.lines=[];for(const para of Web.txt.split("\n")){let ln="";for(const wd of para.split(" ")){const t=ln?ln+" "+wd:wd;if(c.measureText(t).width>mw&&ln){Web.lines.push(ln);ln=wd}else ln=t}Web.lines.push(ln)}}
  const n=Math.max(1,Math.floor((h*100-34*f)/(fs*1.3)));Web.sc=Math.min(Web.sc,Math.max(0,Web.lines.length-n));
  for(let i=0;i<n;i++){const q=Web.lines[Web.sc+i];if(q)c.fillText(q,X,Y+17*f+i*fs*1.3)}
  c.restore()}
function openReader(){P("rd","Lectura",0,-0.3,1.2,0.95,1.05,[
  {l:"▲",x:-0.5,y:0.72,w:0.3,h:0.1,f:()=>{Web.sc=Math.max(0,Web.sc-6)}},{l:"▼",x:-0.15,y:0.72,w:0.3,h:0.1,f:()=>{Web.sc+=6}},{l:"Inicio",x:0.2,y:0.72,w:0.3,h:0.1,f:()=>{Web.sc=0}}],{draw:drawReader})}
function openBrowser(){const b=[["Atrás",()=>Web.back()],["Adelante",()=>Web.fwd()],["Recargar",()=>Web.reload()],["Inicio",()=>Web.go(Store.d.home)],["Editar",()=>{kbTarget="url";openKeyboard()}],
  ["Ir",()=>Web.go(url)],[Web.mode==="mono"?"Estéreo":"Mono",()=>{Web.mode=Web.mode==="mono"?"st":"mono";Web.reload();openBrowser()}],["Pestaña",()=>navTo(url)],["Cerrar",()=>{Web.show(null);close("rd");close("kb");close("br")}]];
  P("br","Navegador",0,0.5,1.3,0.62,1.15,grid(b.map(a=>({l:a[0],f:a[1]})),5,1.3,0.05),{dyn:()=>url&&url!=="https://"?url:"Escribe una dirección o una búsqueda"})}

const KR=[["1234567890","qwertyuiop","asdfghjkl","zxcvbnm./:"],["-_?=&%#@+~","!,;:'\"()*$","[]{}<>|\\^`","0123456789"]];let kbPage=0;
function openKeyboard(){const b=[];KR[kbPage].forEach((r,i)=>[...r].forEach((c,j)=>b.push({l:c,x:-0.7+j*0.14,y:0.04+i*0.13,w:0.125,h:0.11,f:()=>{url=(url==="https://"&&false?"":url)+c}})));
  b.push({l:"⌫",x:-0.7,y:0.58,w:0.15,h:0.11,f:()=>{url=url.slice(0,-1)}},{l:kbPage?"abc":"#+=",x:-0.54,y:0.58,w:0.15,h:0.11,f:()=>{kbPage^=1;openKeyboard()}},
    {l:".com",x:-0.38,y:0.58,w:0.2,h:0.11,f:()=>{url+=".com"}},{l:"espacio",x:-0.16,y:0.58,w:0.4,h:0.11,f:()=>{url+=" "}},
    {l:"Ir",x:0.26,y:0.58,w:0.15,h:0.11,f:()=>{close("kb");Web.go(url)}},{l:"X",x:0.43,y:0.58,w:0.15,h:0.11,f:()=>close("kb")});
  P("kb","Teclado",0,0.25,1.5,0.82,1,b,{dyn:()=>""})}
function openSettings(){const S=Store.d;
  const adj=(l,k,st,mn,mx)=>[{l:l+"−",f:()=>{S[k]=Math.max(mn,+(S[k]-st).toFixed(3));Store.save();L.resize()}},{l:l+"+",f:()=>{S[k]=Math.min(mx,+(S[k]+st).toFixed(3));Store.save();L.resize()}}];
  const it=[].concat(adj("IPD","ipd",0.1,5.5,7.5),[{l:"IPD 6.3",f:()=>{S.ipd=6.3;Store.save();L.resize()}}],adj("Prof","par",0.01,0,0.15),adj("Zoom","fov",0.05,0.6,1.6),adj("Pell","thr",0.02,0.12,0.5),adj("Sens","sens",0.2,0.2,3),adj("Dist","dist",0.05,0,0.6),adj("Px/cm","ppcm",2,30,120),
    [{l:"Cámara",f:()=>Cam.next()},{l:"Recentrar",f:()=>{head.y0=null}},{l:"Manos",f:()=>{S.useHands=!S.useHands;Store.save();if(S.useHands)Hands.init()}},{l:"Giro",f:()=>{S.useGyro=!S.useGyro;Store.save();if(S.useGyro)enableGyro()}}]);
  P("set","Ajustes",0,0,1.5,1.3,1.1,grid(it,4,1.5,0.04).concat([{l:"Cerrar",x:-0.15,y:0.97,w:0.3,h:0.1,f:()=>close("set")}]),{dyn:()=>`IPD ${S.ipd.toFixed(1)} cm · prof ${S.par.toFixed(2)} · zoom ${S.fov.toFixed(2)} · pell ${S.thr.toFixed(2)} · sens ${S.sens.toFixed(1)} · dist ${S.dist.toFixed(2)} · px/cm ${S.ppcm}`})}

function openControls(){P("ctl","Controles",0,0,1.5,0.7,1.1,grid([
  {l:"Manos",f:()=>{Store.d.useHands=true;Store.save();Hands.init()}},{l:"Solo táctil",f:()=>{Store.d.useHands=false;Store.save()}},{l:"Teclado",f:()=>{kbTarget="url";openKeyboard()}},{l:"Recentrar",f:()=>{head.y0=null}}],2,1.5,0.1).concat([{l:"Cerrar",x:-0.15,y:0.5,w:0.3,h:0.1,f:()=>close("ctl")}]),{note:"Táctil: toca la lente. Gamepads: stick mueve el cursor, A = clic."})}
function openStatus(){P("st","Estado",0,0,1.5,0.7,1.1,[{l:"Cerrar",x:-0.15,y:0.5,w:0.3,h:0.1,f:()=>close("st")}],{dyn:()=>`Cámara: ${Cam.on?"activa":"apagada"} · MediaPipe: ${Hands.state} · Manos: ${Hands.hands.filter(h=>h&&h.p).length} · Giroscopio: ${gyro}`})}

/* ===== 6. Sensores ===== */
let gyro="no activado";
let gyroOn=false;
async function enableGyro(){
  try{
    if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){gyro="denegado";Err.show("Permiso de sensores denegado.");return}}
    if(!("DeviceOrientationEvent" in window)){gyro="no disponible";Err.show("Este navegador no ofrece orientación; usa táctil o manos.");return}
    if(!gyroOn){gyroOn=true;addEventListener("deviceorientation",e=>{
      if(!Store.d.useGyro||e.alpha==null)return;gyro="activo";
      const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0,sg=(ang===270||ang===-90)?-1:1,pitch=sg*(e.gamma||0);
      if(head.y0===null){head.y0=e.alpha;head.p0=pitch}
      const dy=((e.alpha-head.y0+540)%360)-180,k=0.02*Store.d.sens;
      head.x=Math.max(-3,Math.min(3,-dy*k));head.y=Math.max(-3,Math.min(3,-(pitch-head.p0)*k))})}
    gyro="esperando datos";
  }catch(e){gyro="error";Err.show("Sensores: "+e.message)}
}

/* ===== 7. Interacción ===== */
const ptrs=[]; // cursores activos: {x,y,down,src}
function hit(x,y){for(let i=panels.length-1;i>=0;i--){const p=panels[i],px=p.x+head.x,py=p.y+head.y,w=p.w*p.s,h=p.h*p.s;
  if(x>px-w/2&&x<px+w/2&&y>py-h/2&&y<py+h/2){
    for(const b of p.btns){const bx=px+b.x*p.s,by=py-h/2+(b.y+0.1)*p.s;if(x>bx&&x<bx+b.w*p.s&&y>by&&y<by+b.h*p.s)return{p,b};}
    return{p}}}return null}
function front(p){panels=panels.filter(q=>q!==p);panels.push(p)}
function click(x,y){const h=hit(x,y);if(h&&h.b&&h.b.f){h.p.flash=performance.now();h.b.f();h.b.t=performance.now();if(navigator.vibrate)navigator.vibrate(15)}}
function interact(now){
  const hs=Hands.hands;
  hs.forEach((h,i)=>{if(!h||!h.p)return;const pt=h.p[8];
    if(h.pinchNow&&!h.pinch){h.pinch=true;h.down=now;h.hv=hit(pt.x,pt.y); // clic inmediato al contacto
      if(h.hv&&h.hv.b)click(pt.x,pt.y);else if(h.hv){h.grab=h.hv.p;h.gx=pt.x-(h.grab.x+head.x);h.gy=pt.y-(h.grab.y+head.y);front(h.grab)}}
    else if(!h.pinchNow&&h.pinch){h.pinch=false;h.grab=null}
    if(h.pinch&&h.grab){
      const o=hs[1-i];
      if(o&&o.pinch&&o.grab===h.grab&&o.p){const d=Math.hypot(pt.x-o.p[8].x,pt.y-o.p[8].y);if(h.grab.d0){h.grab.s=Math.max(0.4,Math.min(2.2,h.grab.s*(d/h.grab.d0)))}h.grab.d0=d}
      else{h.grab.d0=null;h.grab.x+=(pt.x-h.gx-head.x-h.grab.x)*0.5;h.grab.y+=(pt.y-h.gy-head.y-h.grab.y)*0.5}}});
}
/* tacto: tocar lente = clic / arrastrar paneles */
const cv=document.getElementById("c");let touchG=null;
function tpos(e){const t=e.touches&&e.touches[0]||e.changedTouches&&e.changedTouches[0]||e;const r=L.pick(t.clientX*devicePixelRatio,t.clientY*devicePixelRatio);return r}
cv.addEventListener("pointerdown",e=>{if(!Cam.on&&!started)return;const q=L.pick(e.clientX*devicePixelRatio,e.clientY*devicePixelRatio);if(!q)return;
  const h=hit(q.x,q.y);if(h&&h.b)click(q.x,q.y);else if(h){touchG={p:h.p,gx:q.x-(h.p.x+head.x),gy:q.y-(h.p.y+head.y)};front(h.p)}});
cv.addEventListener("pointermove",e=>{if(!touchG)return;const q=L.pick(e.clientX*devicePixelRatio,e.clientY*devicePixelRatio);if(q){touchG.p.x=q.x-touchG.gx-head.x;touchG.p.y=q.y-touchG.gy-head.y}});
addEventListener("pointerup",()=>touchG=null);
/* mando */
let padPos={x:0,y:0},padA=false;
function pads(){const g=(navigator.getGamepads&&navigator.getGamepads()||[])[0];if(!g)return;
  padPos.x=Math.max(-1,Math.min(1,padPos.x+(g.axes[0]||0)*0.03));padPos.y=Math.max(-1,Math.min(1,padPos.y+(g.axes[1]||0)*0.03));
  const a=g.buttons[0]&&g.buttons[0].pressed;if(a&&!padA)click(padPos.x,padPos.y);padA=a;ptrs.push({x:padPos.x,y:padPos.y})}

/* ===== 8. Render estéreo ===== */
const mctx=cv.getContext("2d");let ctx=null;
const eyeC=[0,1].map(()=>document.createElement("canvas"));
let GL=null;
(function(){try{const g=document.createElement("canvas"),gl=g.getContext("webgl",{alpha:false,antialias:false});if(!gl)return;
  const sh=(t,src)=>{const x=gl.createShader(t);gl.shaderSource(x,src);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;varying vec2 u;void main(){u=p;gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 u;uniform sampler2D t;uniform float k,s,ar;void main(){vec2 b=vec2(ar,1.);vec2 w=u*b;vec2 h=b-vec2(.2);float d=length(max(abs(w)-h,0.))-.2;if(d>0.){gl_FragColor=vec4(0.,0.,0.,1.);return;}vec2 v=u*(1.+k*dot(u,u))*s;if(abs(v.x)>1.||abs(v.y)>1.){gl_FragColor=vec4(0.,0.,0.,1.);return;}gl_FragColor=texture2D(t,v*.5+.5);}'));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error("enlace de shader");gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const tex=[0,1].map(()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(q=>gl.texParameteri(gl.TEXTURE_2D,q[0],q[1]));return t});
  GL={g,gl,tex,uk:gl.getUniformLocation(pr,"k"),us:gl.getUniformLocation(pr,"s"),ua:gl.getUniformLocation(pr,"ar")};
}catch(e){GL=null;console.warn("Sin WebGL: ojos sin distorsión",e)}})();
const L={W:0,H:0,R:1,hw:100,hh:100,cx:[0,0],cy:0,
  resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;this.W=cv.width;this.H=cv.height;
    const ipdPx=Store.d.ipd*Store.d.ppcm*d;this.cy=this.H/2;this.cx=[this.W/2-ipdPx/2,this.W/2+ipdPx/2];
    this.hw=Math.round(Math.max(40*d,Math.min(ipdPx/2-3*d,this.cx[0]-2*d)));this.hh=Math.round(this.H*0.47);this.R=Math.min(this.hw,this.hh);
    eyeC.forEach(c=>{c.width=2*this.hw;c.height=2*this.hh});c2.width=this.W;c2.height=this.H;Web.sig=""},
  pick(px,py){const k=Store.d.dist,s=1/(1+0.6*k);for(let e=0;e<2;e++){const ux=(px-this.cx[e])/this.hw,uy=-(py-this.cy)/this.hh;if(Math.abs(ux)>1||Math.abs(uy)>1)continue;
    const m=(1+k*(ux*ux+uy*uy))*s;return{x:ux*m*this.hw/this.R,y:-uy*m*this.hh/this.R}}return null}};
addEventListener("resize",()=>L.resize());addEventListener("orientationchange",()=>setTimeout(()=>L.resize(),200));
function T(s,x,y,sz,mw){ctx.save();ctx.translate(x,y);ctx.scale(.01,.01);ctx.font=`${sz*100}px system-ui,sans-serif`;if(mw)ctx.fillText(s,0,0,mw*100);else ctx.fillText(s,0,0);ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawPanel(p,e,now){const sh=-e*Store.d.par/p.z,px=p.x+head.x+sh,py=p.y+head.y,w=p.w*p.s,h=p.h*p.s,f=p.s;
  ctx.save();ctx.globalAlpha=0.93;rr(px-w/2,py-h/2,w,h,0.04*f);ctx.fillStyle="rgba(8,24,44,.82)";ctx.fill();
  ctx.lineWidth=0.008;ctx.strokeStyle=(now-(p.flash||0)<150)?"#fff":"#3fd2ff";ctx.stroke();
  ctx.fillStyle="#9fe8ff";ctx.textAlign="center";ctx.textBaseline="middle";T(p.title,px,py-h/2+0.07*f,0.065*f,w-0.05);
  const dyn=p.dyn&&p.dyn(),note=dyn!==undefined&&dyn!==null?dyn:p.note;
  p.btns.forEach(b=>{const bx=px+b.x*f,by=py-h/2+(b.y+0.1)*f,bw=b.w*f,bh=b.h*f,hot=ptrs.some(q=>q.x>bx&&q.x<bx+bw&&q.y>by&&q.y<by+bh);
    rr(bx,by,bw,bh,0.025*f);ctx.fillStyle=(now-(b.t||0)<200)?"#3fd2ff":hot?"rgba(63,210,255,.45)":"rgba(63,210,255,.16)";ctx.fill();
    ctx.fillStyle="#fff";T(b.l,bx+bw/2,by+bh/2,Math.min(0.06,bw*0.4/Math.max(3,b.l.length)*1.6)*f,bw*0.95)});
  if(p.draw)p.draw(ctx,px,py-h/2,w,h,f);
  if(note){ctx.fillStyle="#c8f3ff";T(note,px,py+h/2-0.05*f,0.04*f,w-0.06)}
  ctx.restore()}
function drawEye(e,now){const hw=L.hw,hh=L.hh,S=L.R,c=eyeC[e];
  ctx=c.getContext("2d");ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(hw,hh);ctx.scale(S,S);
  ctx.fillStyle="#04121f";ctx.fillRect(-hw/S,-hh/S,2*hw/S,2*hh/S);
  if(Cam.on&&Cam.v.readyState>=2){const z=Cam.size();ctx.drawImage(Cam.v,-z.w/2,-z.h/2,z.w,z.h)}
  panels.forEach(p=>drawPanel(p,e==0?-1:1,now));
  Hands.hands.forEach(h=>{if(!h||!h.p)return;h.p.forEach((q,i)=>{const tip=[4,8,12,16,20].includes(i);ctx.beginPath();ctx.arc(q.x,q.y,tip?0.012:0.006,0,7);ctx.fillStyle=tip?(h.pinch?"#ff5c8a":"#7dffb0"):"rgba(255,255,255,.7)";ctx.fill()})});
  ptrs.forEach(q=>{ctx.beginPath();ctx.arc(q.x,q.y,0.012,0,7);ctx.strokeStyle="#fff";ctx.lineWidth=0.005;ctx.stroke()});
  ctx.fillStyle="#9fe8ff";ctx.textAlign="center";T(`${fps|0} fps · ${Hands.hands.filter(h=>h&&h.p).length} mano(s) · IPD ${Store.d.ipd.toFixed(1)} cm`,0,0.9*hh/S*0.95,0.05);
  if(now<Err.t){ctx.fillStyle="rgba(120,10,30,.9)";rr(-0.8,0.62,1.6,0.16,0.03);ctx.fill();ctx.fillStyle="#fff";T(Err.msg,0,0.7,0.048,1.5)}
  ctx.restore()}
function present(){const W=L.W,H=L.H;
  if(GL){const{g,gl,tex}=GL;if(g.width!==W||g.height!==H){g.width=W;g.height=H}
    gl.viewport(0,0,W,H);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
    const k=Store.d.dist;gl.uniform1f(GL.uk,k);gl.uniform1f(GL.us,1/(1+0.6*k));gl.uniform1f(GL.ua,L.hw/L.hh);
    for(let e=0;e<2;e++){gl.viewport(Math.round(L.cx[e]-L.hw),Math.round(H-(L.cy+L.hh)),eyeC[e].width,eyeC[e].height);gl.bindTexture(gl.TEXTURE_2D,tex[e]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,eyeC[e]);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
    mctx.drawImage(g,0,0)}
  else{mctx.fillStyle="#000";mctx.fillRect(0,0,W,H);for(let e=0;e<2;e++){const x=L.cx[e]-L.hw,y=L.cy-L.hh,w=2*L.hw,h=2*L.hh;mctx.save();mctx.beginPath();mctx.roundRect?mctx.roundRect(x,y,w,h,w*0.12):mctx.rect(x,y,w,h);mctx.clip();mctx.drawImage(eyeC[e],x,y);mctx.restore()}}
  mctx.fillStyle="#fff";mctx.fillRect(W/2-1,H*0.1,2,H*0.8)}

/* ===== 9. Inicio y bucle ===== */
let started=false,fps=60,lt=performance.now();
function splash(){const x=x2;x.clearRect(0,0,c2.width,c2.height);x.fillStyle="#05070d";x.fillRect(0,0,c2.width,c2.height);x.fillStyle="#9fe8ff";x.textAlign="center";x.font=`${L.H*0.07}px system-ui`;x.fillText("Spatial VR Browser · Cardboard Edition",L.W/2,L.H*0.4);x.font=`${L.H*0.045}px system-ui`;x.fillText("Gira el teléfono en horizontal y toca para iniciar",L.W/2,L.H*0.55);x.fillText("(pedirá cámara y sensores)",L.W/2,L.H*0.63)}
async function boot(){if(started)return;started=true;x2.clearRect(0,0,c2.width,c2.height);
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{});
  openHome();enableGyro();await Cam.start();if(Store.d.useHands)Hands.init()}
cv.addEventListener("click",()=>{if(!started)boot()});
function frame(now){requestAnimationFrame(frame);fps+=(1000/Math.max(1,now-lt)-fps)*0.1;lt=now;
  if(!started){splash();return}
  ptrs.length=0;Hands.update(now);interact(now);
  Hands.hands.forEach(h=>{if(h&&h.p)ptrs.push(h.p[8])});pads();
  drawEye(0,now);drawEye(1,now);present();Web.place()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)Cam.stop();else if(started)Cam.start()});
L.resize();requestAnimationFrame(frame);
</script></body></html>
